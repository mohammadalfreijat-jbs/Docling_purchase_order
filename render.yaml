services:
  - type: web
    name: docling-purchase-order
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SERVICE_URL
        sync: false          # set manually in Render dashboard
      - key: API_KEY
        sync: false          # set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.9
