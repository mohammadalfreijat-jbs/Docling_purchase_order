<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PO Consolidator{% endblock %}</title>

  <!-- IBM Carbon Design System (CDN) -->
  <link rel="stylesheet"
        href="https://unpkg.com/@carbon/styles/css/styles.css" />
  <link rel="stylesheet"
        href="https://unpkg.com/carbon-components/css/carbon-components.min.css" />

  <style>
    /* ---- Global overrides ---- */
    body {
      background-color: #f4f4f4;
      font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    }
    /* Hero gradient shared across pages */
    .po-hero {
      background: linear-gradient(135deg, #0f62fe 0%, #6929c4 100%);
      color: #ffffff;
      padding: 3rem 2rem 2.5rem;
    }
    .po-hero h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: .5rem;
    }
    .po-hero p {
      font-size: 1rem;
      opacity: .85;
    }
    /* Stat cards */
    .stat-card {
      background: #ffffff;
      border-radius: 4px;
      padding: 1.25rem 1.5rem;
      border-left: 4px solid #0f62fe;
    }
    .stat-card.purple  { border-left-color: #6929c4; }
    .stat-card.green   { border-left-color: #198038; }
    .stat-card.magenta { border-left-color: #9f1853; }
    .stat-card.blue    { border-left-color: #0f62fe; }
    .stat-card .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #161616;
    }
    .stat-card .stat-label {
      font-size: .875rem;
      color: #525252;
      margin-top: .25rem;
    }
    /* Section headers */
    .section-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: #161616;
      margin-bottom: 1rem;
    }
    /* Tables */
    .cds--data-table-container {
      overflow-x: auto;
    }
    /* Loading overlay */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(22,22,22,.6);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #ffffff;
      font-size: 1rem;
    }
    #loading-overlay.visible {
      display: flex;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<!-- Loading overlay (shown during processing) -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <span id="loading-msg">Processing your files…</span>
</div>

{% block content %}{% endblock %}

</body>
</html>
